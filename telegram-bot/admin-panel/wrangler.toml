# Cloudflare Pages + KV config for the admin panel control plane.
# Deploy with:  npx wrangler pages deploy dist --project-name inception-panel
# Bind the KV namespace below (create it first — see DEPLOY.md).

name = "inception-panel"
compatibility_date = "2024-09-01"

# KV namespace that stores the control-plane state (key "state").
# Create it in the dashboard: Workers & Pages -> KV -> Create namespace ("CONTROL_KV"),
# then put the namespace id in the [[kv_namespaces]] binding.
[[kv_namespaces]]
binding = "CONTROL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Secrets (set via `wrangler pages secret put` — never commit real values):
#   BOT_TOKEN         = your real Telegram bot token (123456:AAA...)
#   BOT_REPORT_SECRET = a long random string shared with the bot
#   OWNER_ID          = 6940999328 (already the default in code)
